<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Hynex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ============================================================
       ADMIN — variabili e reset locale
       ============================================================ */
    :root {
      --black:       #0a0a0a;
      --white:       #ffffff;
      --light:       #f5f5f5;
      --grey:        #888;
      --grey-2:      #333;
      --grey-3:      #ccc;
      --border:      #1e1e1e;
      --accent:      #2d6a4f;
      --accent-dark: #1f4a37;
      --danger:      #c0392b;
      --sidebar-w:   220px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--light);
      color: var(--black);
      min-height: 100vh;
      display: flex;
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .admin-sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--black);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }

    .admin-sidebar__logo {
      padding: 32px 24px 24px;
      border-bottom: 1px solid var(--border);
    }

    .admin-sidebar__logo span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--white);
      letter-spacing: 2px;
    }

    .admin-sidebar__logo small {
      display: block;
      font-size: 10px;
      color: var(--grey);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .admin-nav {
      padding: 24px 0;
      flex: 1;
    }

    .admin-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--grey);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: color 0.2s, background 0.2s;
    }

    .admin-nav a:hover,
    .admin-nav a.active {
      color: var(--white);
      background: var(--grey-2);
    }

    .admin-nav a.active {
      border-left: 2px solid var(--accent);
    }

    .admin-nav__icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    .admin-nav a.active .admin-nav__icon,
    .admin-nav a:hover .admin-nav__icon {
      opacity: 1;
    }

    .admin-sidebar__footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    .admin-sidebar__footer a {
      color: var(--grey);
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }

    .admin-sidebar__footer a:hover { color: var(--white); }

    .admin-logout-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
      padding: 0;
      background: transparent;
      border: none;
      color: var(--grey);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }
    .admin-logout-btn:hover { color: #f87171; }

    .admin-topbar__user {
      color: var(--accent);
      font-weight: 600;
    }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .admin-main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .admin-topbar {
      background: var(--white);
      border-bottom: 1px solid var(--grey-3);
      padding: 0 36px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .admin-topbar__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--black);
    }

    .admin-topbar__meta {
      font-size: 12px;
      color: var(--grey);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .admin-topbar__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .admin-content {
      padding: 36px;
      flex: 1;
    }

    /* ============================================================
       KPI CARDS
       ============================================================ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    .kpi-card {
      background: var(--white);
      border: 1px solid var(--grey-3);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .kpi-card:hover {
      border-color: var(--black);
      transform: translateY(-2px);
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
    }

    .kpi-card__label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 12px;
    }

    .kpi-card__value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      line-height: 1;
      color: var(--black);
      letter-spacing: 1px;
    }

    .kpi-card__value.loading {
      background: var(--light);
      color: transparent;
      border-radius: 4px;
      animation: shimmer 1.2s infinite;
    }

    .kpi-card__sub {
      font-size: 12px;
      color: var(--grey);
      margin-top: 6px;
    }

    @keyframes shimmer {
      0%   { opacity: 0.4; }
      50%  { opacity: 0.8; }
      100% { opacity: 0.4; }
    }

    /* ============================================================
       GRIGLIA INFERIORE — tabella + categorie
       ============================================================ */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    /* ============================================================
       SEZIONE CARD GENERICA
       ============================================================ */
    .dash-card {
      background: var(--white);
      border: 1px solid var(--grey-3);
    }

    .dash-card__header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--grey-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dash-card__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--black);
    }

    .dash-card__badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(45,106,79,0.08);
      padding: 3px 8px;
    }

    /* ============================================================
       TABELLA ORDINI RECENTI
       ============================================================ */
    .ordini-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ordini-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--grey);
      padding: 14px 24px;
      border-bottom: 1px solid var(--grey-3);
      background: var(--light);
    }

    .ordini-table td {
      padding: 16px 24px;
      font-size: 13px;
      color: var(--black);
      border-bottom: 1px solid #f0f0f0;
    }

    .ordini-table tr:last-child td { border-bottom: none; }

    .ordini-table tr:hover td { background: var(--light); }

    .ordine-id {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--grey);
    }

    .ordine-cliente {
      font-weight: 500;
    }

    .ordine-email {
      font-size: 11px;
      color: var(--grey);
    }

    .ordine-totale {
      font-weight: 600;
      font-size: 14px;
    }

    .ordine-data {
      font-size: 11px;
      color: var(--grey);
    }

    /* skeleton row */
    .skeleton-row td {
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .skeleton-bar {
  height: 12px;
  background: var(--light);
  border-radius: 2px;
  animation: shimmer 1.2s infinite;
}
/* larghezze skeleton senza inline style */
.sk-xs  { width: 30px; }
.sk-sm  { width: 60px; }
.sk-md  { width: 80px; }
.sk-ml  { width: 100px; }
.sk-lg  { width: 120px; }
.sk-xl  { width: 140px; }
.sk-thin { height: 12px; } /* esplicito per categoria items */

    /* ============================================================
       CATEGORIE SIDEBAR
       ============================================================ */
    .categorie-list {
      padding: 8px 0;
    }

    .categoria-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    .categoria-item:last-child { border-bottom: none; }
    .categoria-item:hover { background: var(--light); }

    .categoria-item__nome {
      font-weight: 500;
      font-size: 13px;
    }

    .categoria-item__stats {
      text-align: right;
    }

    .categoria-item__count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: var(--black);
      line-height: 1;
    }

    .categoria-item__prezzo {
      font-size: 10px;
      color: var(--grey);
      margin-top: 2px;
    }

    /* barra visiva proporzione */
    .categoria-bar {
      height: 2px;
      background: var(--light);
      margin: 0 24px;
      position: relative;
      overflow: hidden;
    }
    .categoria-bar__fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    /* ============================================================
       STATO ERRORE / EMPTY
       ============================================================ */
    .admin-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      color: var(--grey);
      text-align: center;
      gap: 12px;
    }

    .admin-error__icon {
      font-size: 32px;
      opacity: 0.4;
    }

    .admin-error__msg {
      font-size: 13px;
      line-height: 1.6;
    }

    .admin-error__retry {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      border: none;
      background: none;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      margin-top: 4px;
      transition: background 0.2s, color 0.2s;
    }

    .admin-error__retry:hover {
      background: var(--accent);
      color: var(--white);
    }

    /* ============================================================
       RESPONSIVE (minimo per non rompere su schermi medi)
       ============================================================ */
    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .admin-sidebar { display: none; }
      .admin-main { margin-left: 0; }
      .admin-content { padding: 20px; }
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .admin-topbar { padding: 0 20px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span>HYNEX</span>
      <small>Admin Panel</small>
    </div>

    <nav class="admin-nav">
      <a href="#dashboard" class="active">
        <!-- icona dashboard -->
        <svg class="admin-nav__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="6" height="6" rx="1"/>
          <rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/>
          <rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
        Dashboard
      </a>
      <a href="catalogo.html">
        <svg class="admin-nav__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 4h12M2 8h12M2 12h8"/>
        </svg>
        Catalogo
      </a>
      <a href="carrello.html">
        <svg class="admin-nav__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1 1h2l2 8h7l2-5H5"/>
          <circle cx="7" cy="13" r="1"/>
          <circle cx="12" cy="13" r="1"/>
        </svg>
        Ordini
      </a>
      <a href="index.html">
        <svg class="admin-nav__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 1L1 7h2v7h4v-4h2v4h4V7h2L8 1z"/>
        </svg>
        Vai al sito
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <a href="index.html">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 1L1 7h2v7h4v-4h2v4h4V7h2L8 1z"/>
        </svg>
        Vai al sito
      </a>
      <button id="btnLogout" class="admin-logout-btn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M10 8H2M6 4L2 8l4 4M10 3h3a1 1 0 011 1v8a1 1 0 01-1 1h-3"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- ============================================================
       MAIN
       ============================================================ -->
  <main class="admin-main">

    <header class="admin-topbar">
      <span class="admin-topbar__title">Dashboard</span>
      <span class="admin-topbar__meta">
        <span class="admin-topbar__dot"></span>
        Server attivo — localhost:3000
        &nbsp;·&nbsp;
        <span class="admin-topbar__user">admin</span>
      </span>
    </header>

    <div class="admin-content">

      <!-- KPI CARDS -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-card__label">Fatturato totale</div>
          <div class="kpi-card__value loading" id="kpi-fatturato">€ —</div>
          <div class="kpi-card__sub" id="kpi-fatturato-sub">caricamento…</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Ordini ricevuti</div>
          <div class="kpi-card__value loading" id="kpi-ordini">—</div>
          <div class="kpi-card__sub" id="kpi-ordini-sub">caricamento…</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Prodotti attivi</div>
          <div class="kpi-card__value loading" id="kpi-prodotti">—</div>
          <div class="kpi-card__sub" id="kpi-prodotti-sub">caricamento…</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Categorie</div>
          <div class="kpi-card__value loading" id="kpi-categorie">—</div>
          <div class="kpi-card__sub" id="kpi-categorie-sub">caricamento…</div>
        </div>
      </div>

      <!-- GRIGLIA INFERIORE -->
      <div class="dashboard-grid">

        <!-- ORDINI RECENTI -->
        <div class="dash-card">
          <div class="dash-card__header">
            <span class="dash-card__title">Ultimi ordini</span>
            <span class="dash-card__badge">Live</span>
          </div>
          <div id="ordini-container">
            <!-- skeleton -->
            <table class="ordini-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Cliente</th>
                  <th>Totale</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="ordini-tbody">
                <!-- skeleton rows -->
                <tr class="skeleton-row">
                  <td><div class="skeleton-bar sk-xs"></div></td>
                  <td><div class="skeleton-bar sk-lg"></div></td>
                  <td><div class="skeleton-bar sk-sm"></div></td>
                  <td><div class="skeleton-bar sk-md"></div></td>
                </tr>
                <tr class="skeleton-row">
                  <td><div class="skeleton-bar sk-xs"></div></td>
                  <td><div class="skeleton-bar sk-ml"></div></td>
                  <td><div class="skeleton-bar sk-sm"></div></td>
                  <td><div class="skeleton-bar sk-md"></div></td>
                </tr>
                <tr class="skeleton-row">
                  <td><div class="skeleton-bar sk-xs"></div></td>
                  <td><div class="skeleton-bar sk-xl"></div></td>
                  <td><div class="skeleton-bar sk-sm"></div></td>
                  <td><div class="skeleton-bar sk-md"></div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- CATEGORIE -->
        <div class="dash-card">
          <div class="dash-card__header">
            <span class="dash-card__title">Categorie</span>
          </div>
          <div class="categorie-list" id="categorie-list">
            <!-- skeleton -->
            <div class="categoria-item">
            <div class="skeleton-bar sk-md"></div>
            <div class="skeleton-bar sk-xs sk-thin"></div>
              </div>
              <div class="categoria-item">
              <div class="skeleton-bar sk-ml"></div>
              <div class="skeleton-bar sk-xs sk-thin"></div>
            </div>
              <div class="categoria-item">
              <div class="skeleton-bar sk-sm sk-md"></div>
              <div class="skeleton-bar sk-xs sk-thin"></div>
            </div>
          </div>
        </div>

      </div><!-- /dashboard-grid -->

    </div><!-- /admin-content -->
  </main>

  <!-- Auth guard: redirect immediato se non autenticato, prima ancora che admin.js carichi -->
  <script>
    if (sessionStorage.getItem('hynex_admin') !== 'true') {
      window.location.replace('admin-login.html');
    }
  </script>
  <script src="js/admin.js"></script>
</body>
</html>
